# Runs the same build Cloudflare runs. Fails on dead links, duplicate ids, missing UI words and the other guards in scripts/build-dist.mjs.
name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod reads git history; a shallow clone falls back to mtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-dist.mjs
      - name: Second run must change nothing tracked
        run: git diff --exit-code -- . ':!data/i18n/pages.json' ':!sitemap.xml' # sitemap lastmod is computed before the publish commit that dates it
