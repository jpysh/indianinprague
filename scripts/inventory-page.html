<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inventory — Guldaar Bazaar</title>
<style>
  /* Local-only page: inline styles on purpose, no cache token, no CSP to satisfy. It is
     styled close enough to the shop to be readable at a glance, not identical to it — this
     is a working tool, and a tool that pretends to be the shop invites editing the wrong one. */
  :root{
    --void:#4A4433;--void-2:#413C2D;--band:#353022;--bone:#F2EFE6;--bone-dim:#D6CFB8;
    --saffron:#DCE775;--chilli:#B8431F;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--bone);font:14px/1.5 var(--mono)}
  header{position:sticky;top:0;z-index:5;background:var(--void-2);border-bottom:1px solid var(--band);padding:12px 16px}
  h1{margin:0 0 8px;font-size:16px;letter-spacing:.08em}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input,select{font:13px var(--mono);color:var(--bone);background:var(--void);border:1px solid var(--band);border-radius:2px;padding:7px 10px}
  input[type=search]{min-width:220px;flex:1}
  .changes{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--bone-dim)}
  .changes b{color:var(--saffron)}
  main{padding:12px 16px 120px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:104px;background:var(--void-2);text-align:left;font-weight:500;font-size:12px;
     color:var(--bone-dim);padding:8px 6px;border-bottom:1px solid var(--band)}
  td{padding:6px;border-bottom:1px solid var(--band);vertical-align:middle}
  tr[data-ro="1"]{opacity:.62}
  img{width:44px;height:78px;object-fit:cover;border-radius:2px;background:var(--band)}
  .t{max-width:420px}
  .muted{color:var(--bone-dim);font-size:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--band)}
  .in{color:var(--saffron)} .out{color:#E8A93C} .sold{color:var(--chilli)}
  .new{outline:2px solid var(--saffron);outline-offset:-2px}
  input.price{width:78px}
  /* The save bar only exists when there is something to save — a permanently visible
     "Save" with nothing to save trains you to ignore it. */
  .savebar{position:fixed;left:0;right:0;bottom:0;background:var(--void-2);border-top:1px solid var(--band);
    padding:12px 16px;display:flex;gap:12px;align-items:center}
  .savebar[hidden]{display:none}
  button{font:13px var(--mono);padding:9px 16px;border-radius:2px;border:1px solid var(--saffron);
    background:var(--saffron);color:var(--void);cursor:pointer}
  button.ghost{background:transparent;color:var(--bone);border-color:var(--band)}
  code{background:var(--band);padding:2px 6px;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>INVENTORY</h1>
  <div class="bar">
    <input type="search" id="q" placeholder="Search title or SKU…">
    <select id="vendor"><option value="">All vendors</option></select>
    <select id="shelf"><option value="">All shelves</option></select>
    <select id="sub"><option value="">All subcategories</option></select>
    <select id="state">
      <option value="">Any state</option>
      <option value="in stock">In stock</option>
      <option value="out of stock">Out of stock</option>
      <option value="sold">Sold</option>
      <option value="unlisted">Not listed</option>
      <option value="changed">Changed this sync</option>
    </select>
    <span class="muted" id="count"></span>
  </div>
  <div class="changes" id="changes"></div>
</header>

<main>
  <table>
    <thead><tr>
      <th></th><th>Title</th><th>Shelf</th><th>Price €</th><th>Override €</th><th>State</th><th>Sold</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="savebar" id="savebar" hidden>
  <span id="pending"></span>
  <button id="save">Save to overrides.json</button>
  <button class="ghost" id="discard">Discard</button>
  <span class="muted">Saved changes go live with the nightly job, or run <code>./scripts/publish.sh</code></span>
</div>

<script>
(function () {
  var data = { items: [], changes: {} };
  var patch = {};           // sku -> fields, pending save
  var changedSkus = new Set();

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); };

  function fillSelect(el, values) {
    values.sort().forEach(function (v) {
      var o = document.createElement("option"); o.value = v; o.textContent = v; el.appendChild(o);
    });
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var fv = $("vendor").value, fsh = $("shelf").value, fsub = $("sub").value, fst = $("state").value;

    var rows = data.items.filter(function (i) {
      if (fv && i.vendor !== fv) return false;
      if (fsh && i.shelf !== fsh) return false;
      if (fsub && i.sub !== fsub) return false;
      if (fst === "unlisted" && i.listed) return false;
      if (fst === "sold" && !i.sold) return false;
      if (fst === "in stock" && (i.sold || i.stock !== "in stock")) return false;
      if (fst === "out of stock" && (i.sold || i.stock !== "out of stock")) return false;
      if (fst === "changed" && !changedSkus.has(i.sku)) return false;
      if (q && (i.title || "").toLowerCase().indexOf(q) === -1 && String(i.sku).indexOf(q) === -1) return false;
      return true;
    });

    $("count").textContent = rows.length + " of " + data.items.length;

    // Capped: this is a scanning tool, and 1,600 rows of images is a page that stutters.
    // Filters are how you get to what you want, which is why they are at the top.
    var slice = rows.slice(0, 300);
    $("rows").innerHTML = slice.map(function (i) {
      var state = i.sold ? '<span class="pill sold">Sold ' + esc(i.sold) + "</span>"
        : !i.listed ? '<span class="pill">Not listed</span>'
        : i.stock === "out of stock" ? '<span class="pill out">Out of stock</span>'
        : '<span class="pill in">In stock</span>';
      var pend = patch[i.sku] || {};
      var price = pend.price_eur !== undefined ? pend.price_eur : i.priceOverride;
      return '<tr data-sku="' + esc(i.sku) + '" data-ro="' + (i.readOnly ? 1 : 0) + '"' +
        (changedSkus.has(i.sku) ? ' class="new"' : "") + ">" +
        "<td>" + (i.thumb ? '<img loading="lazy" src="' + esc(i.thumb) + '" alt="">' : "") + "</td>" +
        '<td class="t">' + esc(i.title) + '<div class="muted">' + esc(i.vendor) + " · " + esc(i.sku) +
          (i.sub ? " · " + esc(i.sub) : "") + "</div></td>" +
        "<td>" + esc(i.shelf) + "</td>" +
        "<td>" + (i.priceEur || "") + '<div class="muted">' + (i.vendorCzk || "") + " Kč</div></td>" +
        "<td>" + (i.readOnly ? "" : '<input class="price" type="number" step="0.01" value="' + esc(price) + '" data-f="price_eur">') + "</td>" +
        "<td>" + state + "</td>" +
        "<td>" + (i.readOnly ? '<span class="muted">auto</span>'
          : '<input type="checkbox" data-f="sold"' + ((pend.sold !== undefined ? pend.sold : i.sold) ? " checked" : "") + ">") + "</td>" +
        "</tr>";
    }).join("") + (rows.length > slice.length
      ? '<tr><td colspan="7" class="muted">' + (rows.length - slice.length) + " more — narrow the filters to see them</td></tr>"
      : "");
  }

  function note(sku, field, value) {
    patch[sku] = patch[sku] || {};
    patch[sku][field] = value;
    var n = Object.keys(patch).length;
    $("pending").textContent = n + (n === 1 ? " item edited" : " items edited");
    $("savebar").hidden = n === 0;
  }

  document.addEventListener("input", function (e) {
    var tr = e.target.closest && e.target.closest("tr[data-sku]");
    if (!tr || !e.target.dataset.f) return;
    if (e.target.dataset.f === "price_eur") note(tr.dataset.sku, "price_eur", e.target.value);
  });
  document.addEventListener("change", function (e) {
    var tr = e.target.closest && e.target.closest("tr[data-sku]");
    if (tr && e.target.dataset.f === "sold") {
      // Dated, not boolean: a sold mark with no date cannot be sorted or aged out.
      note(tr.dataset.sku, "sold", e.target.checked ? new Date().toISOString().slice(0, 10) : "");
      return;
    }
    if (["vendor", "shelf", "sub", "state"].indexOf(e.target.id) !== -1) render();
  });
  $("q").addEventListener("input", render);

  $("save").addEventListener("click", function () {
    fetch("/api/save", {
      method: "POST",
      // Explicit: the server refuses anything that is not application/json, because a
      // cross-site form can send text/plain without a preflight and JSON.parse would take it.
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        patch = {}; $("savebar").hidden = true;
        return load();
      })
      .catch(function (err) { alert("Save failed: " + err.message); });
  });
  $("discard").addEventListener("click", function () { patch = {}; $("savebar").hidden = true; render(); });

  function load() {
    return fetch("/api/inventory").then(function (r) { return r.json(); }).then(function (d) {
      data = d;
      var c = d.changes || {};
      changedSkus = new Set([].concat(c.added || [], c.price || [], c.stock || []).map(function (x) { return x.sku; }));
      $("changes").innerHTML = c.first
        ? "<span>first sync — nothing to compare yet</span>"
        : ["<b>" + (c.added || []).length + "</b> new",
           "<b>" + (c.price || []).length + "</b> price changes",
           "<b>" + (c.stock || []).length + "</b> stock changes",
           "<b>" + (c.gone || []).length + "</b> gone from Govinda"].map(function (s) { return "<span>" + s + "</span>"; }).join("");
      if (!$("vendor").options.length || $("vendor").options.length === 1) {
        fillSelect($("vendor"), [...new Set(d.items.map(function (i) { return i.vendor; }))]);
        fillSelect($("shelf"), [...new Set(d.items.map(function (i) { return i.shelf; }).filter(Boolean))]);
        fillSelect($("sub"), [...new Set(d.items.map(function (i) { return i.sub; }).filter(Boolean))]);
      }
      render();
    });
  }
  load();
})();
</script>
</body>
</html>
