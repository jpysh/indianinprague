server {
  listen 8080;
  server_name indianinprague.jains.es localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Requests arrive from cloudflared over the compose network. Don't advertise the nginx
  # version, and let Cloudflare do the buffering.
  server_tokens off;

  # Any redirect nginx emits (e.g. the =404 fallthrough on a directory) would otherwise be
  # made absolute from server_name + the LISTEN port, producing
  # `http://indianinprague.jains.es:8080/...`. Port 8080 is internal to the compose
  # network and http is not what the visitor is on, so such a link would dead-end
  # publicly. Relative redirects let the browser keep the original scheme, host and port.
  absolute_redirect off;
  port_in_redirect off;

  include /etc/nginx/snippets/security-headers.conf;

  # The pages link each other with explicit extensions (`clothes.html`), which is what the
  # markup ships today. `$uri.html` is here so the extensionless form (/clothes) also
  # works — worth having for anything typed by hand or shared without the suffix.
  # shop.html became wardrobe.html when the top nav went to four modules and the word "shop"
  # left the visitor-facing site. It was the most linked and best indexed page here, so the
  # old path is kept alive permanently rather than allowed to 404.
  #
  # 301 and not 302: the move is permanent, and only a 301 passes the accumulated ranking on
  # to the new URL. Both the extensionless and the .html form are handled, because the
  # location / block below serves both.
  location = /shop.html { return 301 /wardrobe.html; }
  location = /shop      { return 301 /wardrobe.html; }

  # ---------------------------------------------------------------------------
  # /spirituality.html — the one page on this site with a relaxed policy.
  #
  # The page was authored as a self-contained export and is served exactly as written:
  # an inline <style>, an inline <script>, GSAP + ScrollTrigger + three.js from cdnjs,
  # Lenis from unpkg, Google Fonts, and its photographs from images.unsplash.com.
  #
  # Under the site-wide policy it does not degrade — it fails completely. Measured on the
  # real header before this block existed: 0 CSS rules applied, body transparent, headings
  # falling back to Times, and the preloader frozen at "0%" because its script never ran.
  # A blank white page. So serving the file as-is REQUIRES this exception; without it the
  # deploy is just a 404 with extra steps.
  #
  # What it costs, stated plainly so it is not rediscovered later:
  #   - cdnjs, unpkg, fonts.googleapis.com, fonts.gstatic.com and images.unsplash.com all
  #     see the IP and User-Agent of every visitor to this page. Google Fonts logs requests.
  #   - 'unsafe-inline' on script-src removes the protection that makes an injected <script>
  #     inert. It is the single most load-bearing directive in the site-wide policy.
  #   - The footer on this page states "No cookies, no trackers, no analytics", which is no
  #     longer accurate here even though none of these origins is an analytics vendor.
  #   - Every other page keeps the strict policy. This block is scoped with `location =`,
  #     an exact match, so it cannot leak to anything else.
  #
  # To undo: delete this block. The ported version of the page — same design, all assets
  # self-hosted, no third-party origin, passes the strict policy — is the alternative.
  #
  # NOTE on the nginx inheritance rule (see security-headers.conf): a location that sets
  # ANY add_header of its own inherits NONE from the parent. So every other security header
  # is repeated here deliberately. Do not "tidy" them away.
  location = /spirituality.html {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Derived images are content-addressed by width (name-400.webp), so a given URL's bytes
  # never change: replacing a photo regenerates a file under the same name only if the
  # source itself changed, and the HTML is what points at it. A year is safe.
  location /images/derived/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Fonts are pinned releases of IBM Plex Mono and only change if deliberately replaced.
  location /assets/fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { font/woff2 woff2; }
    try_files $uri =404;
  }

  # Stylesheets are versioned by the ?v=N token that scripts/bump-assets.mjs writes into
  # every <link>, so a given URL's bytes never change and a year is safe.
  #
  # This was briefly `max-age=86400, must-revalidate`, which is a trap worth naming:
  # must-revalidate only applies once an entry is ALREADY stale, so a CSS change stayed
  # invisible for a day. A palette fix shipped correctly into the container and then sat
  # behind `cf-cache-status: HIT` at Cloudflare's edge. The query token is what fixes it —
  # a release changes the cache key, so nothing has to expire for the new CSS to be seen.
  #
  # Bump the token whenever anything under assets/ changes, or this WILL serve stale CSS.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # HTML must always revalidate, or a deploy is invisible to anyone holding a cached copy.
  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Crawler files: short cache so a robots/sitemap/llms correction propagates quickly.
  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    # llms.txt is markdown; without this nginx would serve it as application/octet-stream
    # and a browser would download it instead of showing it.
    default_type text/plain;
    charset utf-8;
  }

  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 6;
  # The JSON-LD blocks are the most compressible thing on the site (clothes.html carries
  # ~24 KB of repetitive Product JSON), so text/html and the stylesheets matter most here.
  # woff2 and the JPEG/WebP derivatives are already compressed and are deliberately absent.
  gzip_types text/plain text/css text/xml application/json application/ld+json
             application/xml image/svg+xml;

  # Access logs go to stdout in this image, which is what `docker logs` reads. The
  # container health check hits this every 30s and would otherwise dominate the log.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }
}
