# Security headers, kept in a snippet because of an nginx inheritance rule that is easy
# to get wrong: `add_header` directives are inherited from the enclosing block ONLY if the
# current block declares none of its own. So any `location` that sets its own
# Cache-Control would silently drop every header below. Each such block re-includes this
# file instead.

# Everything the site needs is served from this origin, so the whole policy collapses to
# 'self'. Worth spelling out how it got this strict:
#
#   - script-src 'self': one script, assets/shop.js, which filters and sorts the shop grid.
#     It was 'none' until the catalog outgrew a single hand-written page. Note there is
#     still NO 'unsafe-inline' — shop.js is an external file with no inline handlers, so a
#     script injected into the markup by any means still cannot execute.
#   - style-src 'self' with NO 'unsafe-inline': the five inline <style> blocks were moved
#     into assets/*.css and there is not a single style="" attribute in the markup.
#   - font-src 'self': IBM Plex Mono is self-hosted from assets/fonts/ rather than pulled
#     from fonts.gstatic.com.
#
# The practical effect is that there is no third-party origin left on the site at all —
# nothing to leak a visitor's IP to, and nothing that could set a cookie.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
# Outbound links go to vinted.cz. strict-origin-when-cross-origin sends only the origin
# there, never the full path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No analytics, no ads, no personalisation — so every powerful feature is denied outright,
# including the Topics API (interest-cohort), which is the browser-level tracking channel
# a site has to opt out of explicitly.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;

# TLS is terminated by Cloudflare, so nginx itself never sees https — but the header is
# passed through to the browser, which is what matters. Two years, subdomains included.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
