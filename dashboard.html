<!DOCTYPE html>
<!--
  The weekly pass. Served ONLY by scripts/dashboard-server.mjs on 127.0.0.1 and listed in
  PRIVATE_PAGES in scripts/build-dist.mjs, so it is never staged to the live site — it shows
  cost prices and can trigger a deploy.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard — Guldaar Bazaar</title>
<style>
  :root {
    --ink: #1c1a17; --dim: #6b6459; --line: #e2ddd4; --bg: #faf8f4; --card: #fff;
    --act: #b4442c; --ok: #3f7a4f; --note: #8a7a4e; --accent: #1c1a17;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex;
    align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
    margin: 28px 0 10px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .pad { padding: 14px 16px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 6px; padding: 6px 12px; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary[disabled] { opacity: .4; cursor: default; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { padding: 5px 10px; border-radius: 6px; border: 1px solid transparent; background: none; }
  .tab[aria-current="true"] { border-color: var(--line); background: var(--bg); font-weight: 600; }
  .tab small { color: var(--dim); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  ul.checks { list-style: none; margin: 0; padding: 0; }
  ul.checks li { padding: 9px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  ul.checks li:first-child { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
  .act .dot { background: var(--act); } .note .dot { background: var(--note); }
  .ok .dot { background: var(--ok); }
  /* Separate bordered cards rather than the usual 1px-gap-over-a-coloured-background trick.
     That trick only looks right when the last row is full: English spans two columns, so the
     row wraps at most widths and the leftover cells rendered as a grey slab of separator
     colour. Individual borders make a partial row look deliberate. */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
  .grid > div { background: var(--card); padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 8px; }
  .grid b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  /* English is the source, not a language beside the others: it gets two columns, its own
     ground, and a rail, so the row reads as "this is the corpus, and here is how much of it
     each language has" rather than as eight peers. */
  .grid .source { background: #f3efe6; box-shadow: inset 3px 0 0 var(--ink);
    grid-column: span 2; display: flex; flex-direction: column; gap: 3px; }
  .grid .source b { color: var(--ink); }
  .grid .source span { line-height: 1.45; }
  .grid .churn { color: var(--act); font-weight: 600; }
  .grid .quiet { color: var(--dim); }
  .grid span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .en { color: var(--dim); white-space: pre-wrap; }
  .was { color: var(--act); text-decoration: line-through; white-space: pre-wrap; display: block;
    margin-bottom: 4px; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; background: var(--bg); resize: vertical; min-height: 38px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--card); }
  textarea.edited { border-color: var(--act); background: #fff8f5; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line);
    color: var(--dim); white-space: nowrap; }
  .tag.mine { border-color: var(--ok); color: var(--ok); }
  .tag.stale { border-color: var(--act); color: var(--act); }
  .tag.gap { border-color: var(--act); color: var(--act); }
  .filters { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); min-width: 220px; }
  .where { font-size: 12px; color: var(--dim); }
  pre { background: #14120f; color: #d8d2c6; padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; font-size: 12px; line-height: 1.45; max-height: 320px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Indian <b>/</b> in <b>/</b> Prague</h1>
  <nav class="tabs" id="tabs" aria-label="Language"></nav>
  <span class="spacer"></span>
  <span id="dirty" class="muted"></span>
  <button id="save" class="primary" disabled>Save</button>
  <button id="publish">Publish</button>
</header>

<main>
  <h2>This week</h2>
  <div class="card"><ul class="checks" id="checklist"></ul></div>

  <h2>Coverage</h2>
  <div class="grid" id="coverage"></div>

  <h2>Inventory</h2>
  <div class="grid" id="inventory"></div>

  <h2>Translations</h2>
  <div class="filters">
    <input type="search" id="q" placeholder="Search English or translation…">
    <button class="tab" data-filter="all" aria-current="true">All</button>
    <button class="tab" data-filter="stale">Needs you</button>
    <button class="tab" data-filter="missing">Untranslated</button>
    <button class="tab" data-filter="mine">My edits</button>
    <span class="muted" id="count"></span>
  </div>
  <div class="card"><table>
    <thead><tr><th style="width:34%">English</th><th style="width:44%">Translation</th><th style="width:22%"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>

  <h2>Publish log</h2>
  <div class="card pad" id="publishes"></div>
  <pre id="publog" hidden></pre>
</main>

<script>
// One page, one fetch per language, no framework. Edits live in `dirty` until you press
// Save; nothing is written to disk on keystroke, so a stray tab close costs an edit rather
// than corrupting a file.
let state = null, lang = "de", dirty = {}, filter = "all", q = "";

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load(next) {
  if (next && next !== lang && Object.keys(dirty).length &&
      !confirm("You have unsaved edits in " + lang + ". Switch anyway and lose them?")) return;
  if (next) { lang = next; dirty = {}; }
  state = await (await fetch("/api/state?lang=" + lang)).json();
  render();
}

function render() {
  el("tabs").innerHTML = state.languages.map((l) =>
    `<button class="tab" data-lang="${l.code}" aria-current="${l.code === lang}">${esc(l.name)}
     <small>${Math.round((l.translated / (l.total || 1)) * 100)}%</small></button>`).join("");

  el("checklist").innerHTML = state.checklist.map((c) =>
    `<li class="${c.level}"><span class="dot"></span><span>${esc(c.text)}</span></li>`).join("");

  // English leads the coverage row: it is the thing being translated, so its size and churn
  // are the context for every percentage beside it. No bar — English has no coverage to
  // show, it IS the coverage.
  const en = state.english;
  el("coverage").innerHTML = `<div class="source">
      <b>${en.total.toLocaleString()}</b><span>English strings</span>
      <span>${(en.characters / 1000).toFixed(0)}k characters · ${en.products} product fields · ${en.pageText} page text</span>
      <span class="${en.added || en.edited ? "churn" : "quiet"}">${
        en.added || en.edited
          ? `${en.added} new · ${en.edited} rewritten in ${en.days} days`
          : `unchanged in ${en.days} days`
      }</span>
    </div>` + state.languages.map((l) => {
    const pct = Math.round((l.translated / (l.total || 1)) * 100);
    return `<div><b>${pct}%</b><span>${esc(l.name)}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span>${l.missing} missing${l.stale ? " · " + l.stale + " stale" : ""}${l.overridden ? " · " + l.overridden + " yours" : ""}</span></div>`;
  }).join("");

  const i = state.inventory;
  el("inventory").innerHTML = [
    [i.live, "Live items"], [i.valueCzk.toLocaleString() + " Kč", "Stock value"],
    [i.sold30, "Sold, 30 days"], [i.sold30Czk.toLocaleString() + " Kč", "Sold value"],
    [i.reserved, "Reserved"], [i.needsEnrich, "Never enriched"], [i.noPhoto, "No photo"],
  ].map(([n, label]) => `<div><b>${n}</b><span>${esc(label)}</span></div>`).join("");

  renderRows();
  renderPublishes();
}

function visible() {
  const needle = q.toLowerCase();
  return state.rows.filter((r) => {
    if (filter === "stale" && !r.stale) return false;
    if (filter === "missing" && r.text) return false;
    if (filter === "mine" && r.from !== "override") return false;
    if (needle && !(r.english + " " + (r.text || "")).toLowerCase().includes(needle)) return false;
    return true;
  });
}

function renderRows() {
  const rows = visible();
  el("count").textContent = rows.length + " of " + state.rows.length;
  // Long lists of textareas are slow to build and slower to scroll; the weekly pass never
  // needs more than a screenful at a time, and the filters are how you reach the rest.
  el("rows").innerHTML = rows.slice(0, 200).map((r) => {
    const value = dirty[r.key] !== undefined ? dirty[r.key] : (r.text || "");
    const tags = [
      r.stale ? '<span class="tag stale">English changed</span>' : "",
      r.from === "override" ? '<span class="tag mine">Yours</span>' : "",
      !r.text ? '<span class="tag gap">Untranslated — shows English</span>' : "",
      r.via ? `<span class="tag">${esc(r.via)}</span>` : "",
    ].join(" ");
    return `<tr>
      <td>${r.wasEnglish && r.wasEnglish !== r.english ? `<span class="was">${esc(r.wasEnglish)}</span>` : ""}
        <span class="en">${esc(r.english)}</span><div class="where">${esc(r.where)}</div></td>
      <td><textarea data-key="${esc(r.key)}" rows="${Math.min(6, Math.ceil(r.english.length / 70))}"
        placeholder="${esc(r.machine || "not translated yet")}"
        class="${dirty[r.key] !== undefined ? "edited" : ""}">${esc(value)}</textarea></td>
      <td>${tags}</td></tr>`;
  }).join("");
  if (rows.length > 200) el("count").textContent += " (showing 200 — filter to see more)";
}

function renderPublishes() {
  const p = state.publishes;
  el("publishes").innerHTML = p.length
    ? p.map((r) => `<div>${r.failed ? "⚠" : r.deployed ? "✓" : "·"}
        <span class="muted">step ${r.steps}/${r.total || "?"}</span> — ${esc(r.last)}
        ${r.warnings.map((w) => `<div class="muted">&nbsp;&nbsp;${esc(w)}</div>`).join("")}</div>`).join("")
    : '<span class="muted">No runs recorded yet.</span>';
}

function markDirty() {
  const n = Object.keys(dirty).length;
  el("dirty").textContent = n ? n + " unsaved" : "";
  el("save").disabled = !n;
}

document.addEventListener("input", (e) => {
  const key = e.target.dataset?.key;
  if (!key) return;
  dirty[key] = e.target.value;
  e.target.classList.add("edited");
  markDirty();
});

el("tabs").addEventListener("click", (e) => {
  const code = e.target.closest("[data-lang]")?.dataset.lang;
  if (code) load(code);
});

document.querySelectorAll("[data-filter]").forEach((b) =>
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-current", x === b));
    renderRows();
    // Filtering to two rows out of 305 shortens the page under you, and the browser keeps
    // the old scroll position — which is now past the end of the document, showing nothing.
    b.scrollIntoView({ block: "center" });
  }));

el("q").addEventListener("input", (e) => { q = e.target.value; renderRows(); });

el("save").addEventListener("click", async () => {
  const res = await (await fetch("/api/save", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lang, edits: dirty }),
  })).json();
  if (res.error) return alert("Save failed: " + res.error);
  dirty = {};
  markDirty();
  await load();
});

el("publish").addEventListener("click", async () => {
  if (!confirm("Rebuild the whole site and deploy it live?")) return;
  await fetch("/api/publish", { method: "POST" });
  el("publog").hidden = false;
  const poll = setInterval(async () => {
    const r = await (await fetch("/api/publish")).json();
    el("publog").textContent = (r.out || []).join("\n");
    el("publog").scrollTop = el("publog").scrollHeight;
    if (r.code !== undefined && r.code !== null) { clearInterval(poll); load(); }
  }, 2000);
});

addEventListener("beforeunload", (e) => { if (Object.keys(dirty).length) e.preventDefault(); });

load();
</script>
</body>
</html>
